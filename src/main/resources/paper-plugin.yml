name: DeluxeMenus
version: "${version}"
main: com.extendedclip.deluxemenus.DeluxeMenus
description: All in one inventory menu system
authors: [HelpChat]
# Native dialogs are a core feature of DeluxeMenus, so the declared API version matches the
# compatibility floor enforced at runtime: Paper/Minecraft 1.21.7 and newer only.
api-version: "1.21.7"

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: true
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    HeadDatabase:
      load: BEFORE
      required: false
      join-classpath: true
    HeadDB:
      load: BEFORE
      required: false
      join-classpath: true
    CraftEngine:
      load: BEFORE
      required: false
      join-classpath: true
    ItemsAdder:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    Oraxen:
      load: BEFORE
      required: false
      join-classpath: true
    ExecutableItems:
      load: BEFORE
      required: false
      join-classpath: true
    ExecutableBlocks:
      load: BEFORE
      required: false
      join-classpath: true
    Score:
      load: BEFORE
      required: false
      join-classpath: true
    SimpleItemGenerator:
      load: BEFORE
      required: false
      join-classpath: true
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  deluxemenus.admin:
    description: admin commands
    default: op
  deluxemenus.open:
    description: open a menu with /dm open <menu>
    default: op
  deluxemenus.open.others:
    description: open a menu with /dm open <menu> <player>
    default: op
  deluxemenus.open.bypass:
    description: attempt to open a menu for a viewer skipping view requirement checking for the player
    default: op
  deluxemenus.menu.*:
    description: permission for all menus
    default: op
  deluxemenus.openrequirement.bypass.*:
    description: Allows the viewer to bypass all menu open requirements
    default: op
  deluxemenus.placeholdersfor:
    description: permission to parse menu placeholders with /dm open <menu> p:<player>
    default: op
  deluxemenus.placeholdersfor.exempt:
    description: exempt from placeholders being parsed when targeted with /dm open <menu p:<player> for players with this permission
    default: op
  deluxemenus.dialog.open:
    description: open a dialog with /dm dialog open <dialog> [player]
    default: op
  deluxemenus.dialog.open.others:
    description: open a dialog for another player with /dm dialog open <dialog> <player>
    default: op
  deluxemenus.dialog.open.bypass:
    description: open a dialog for a viewer skipping the dialog's own permission and open requirements
    default: op
  deluxemenus.dialog.list:
    description: list the loaded dialogs with /dm dialog list
    default: op
  deluxemenus.dialog.admin:
    description: inspect a loaded dialog with /dm dialog info <dialog>
    default: op
