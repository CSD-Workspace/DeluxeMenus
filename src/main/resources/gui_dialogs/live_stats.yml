# DeluxeMenus example dialog - a display that the player updates on demand.
#
# The [refresh] action re-renders and re-sends this dialog, so the placeholders below resolve
# again the moment the button is pressed. That is the only way a dialog can be updated: a dialog
# cannot be changed in place, and the client is never asked to re-read one on its own.
#
# Why there is no refresh_interval here
# -------------------------------------
# 'options.refresh_interval' would re-send this dialog on a timer, and setting it would also switch
# escape off for this dialog - the two always go together, and neither is a separate option. The
# reason is that Minecraft never tells the server that a dialog was dismissed: there is no dialog
# close event, no packet for it, and a dialog is not a container, so nothing at all reaches the
# server when the player presses escape. A timer therefore cannot tell that the player left, and
# would keep re-opening a dialog that had already been closed.
#
# So a dialog gets exactly one of these:
#
#   * no refresh_interval - escape closes it, and updates come from a button ([refresh]) - what this
#     file does; or
#   * refresh_interval set - the dialog updates itself, and escape does nothing, so a button is the
#     only way out. Choose this only when a live display matters more than escape.
#
# A refreshed dialog is re-sent whole, so anything the player had typed is cleared. Only refresh
# dialogs that display data, not forms; the plugin warns at load time if you do both.
#
# Docs: https://github.com/HelpChat/DeluxeMenus/blob/main/docs/dialogs/README.md
# Rename or delete this file freely; it is only written once, on a fresh install.

id: live_stats
type: multi_action
title: "&aYour stats"

options:
  columns: 2
  refresh_interval: 1
  refresh_max_seconds: 300
body:
  - type: text
    content: "&7Health: &c%player_health%&7/&c%player_max_health%"
    width: 250
  - type: text
    content: "&7Food: &e%player_food_level%"
    width: 250
  - type: text
    content: "&7Level: &a%player_level%"
    width: 250
  - type: text
    content: "&7World: &b%player_world%"
    width: 250
  - type: text
    content: "&8Press Refresh to read your stats again."
    width: 250

buttons:
  - id: refresh_now
    label: "&bRefresh"
    tooltip: "&7Read your stats again"
    width: 150
    actions:
      # The click travels to the server, so the values shown are current to this moment.
      - type: refresh

  - id: close
    label: "&7Close"
    width: 150
    actions:
      # In a dialog [close] dismisses the dialog itself rather than an inventory.
      - type: close
